<section class="master-dashboard-section">
  <div class="master-dashboard-container">
    <div class="dashboard-hero-card">
      <div class="welcome-text-group" style="display: flex; justify-content: space-between; align-items: center;">
        <div>
          <h2>Soporte al Viajero</h2>
          <p>Estamos aquí para ayudarte las 24 horas.</p>
        </div>
        <button class="btn-uni-search" (click)="regresar()">← Volver al Panel</button>
      </div>

      <!-- FORMULARIO DE SOPORTE -->
      <div class="support-form-container">
        <h3 class="support-title">Centro de Ayuda y Consultas</h3>
        <p class="support-subtitle">¿Tienes algún inconveniente con tu vuelo o reserva? Envíanos tu inquietud.</p>

        @if (enviadoExito) {
          <div class="alert-success">
            ¡Solicitud enviada con éxito! Un asesor se pondrá en contacto contigo muy pronto.
          </div>
        }

        <div class="form-group">
          <label>Motivo o Asunto</label>
          <input type="text" [(ngModel)]="asunto" placeholder="Ej: Cambio de itinerario, equipaje demorado...">
        </div>

        <div class="form-group">
          <label>Descripción de tu Inquietud</label>
          <textarea [(ngModel)]="mensaje" rows="4" placeholder="Detalla tu problema o duda aquí..."></textarea>
        </div>

        <button class="user-card-btn" (click)="enviarSolicitud()">Enviar Solicitud</button>
      </div>
    </div>
  </div>
</section>
