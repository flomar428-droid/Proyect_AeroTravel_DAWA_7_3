<section class="login-section">
  <div class="login-card">
    <div class="login-header">
      <h2>Iniciar Sesión</h2>
      <p>Accede a tu cuenta de pasajero</p>
    </div>
    
    <div class="login-form">
      <div class="form-group">
        <label for="usuario">Usuario / Pasajero</label>
        <input type="text" id="usuario" [(ngModel)]="usuarioInput" placeholder="Ingrese su usuario">
      </div>
      
      <div class="form-group">
        <label for="clave">Contraseña</label>
        <input type="password" id="clave" [(ngModel)]="claveInput" placeholder="Ingrese su contraseña">
      </div>

      @if (mensajeLogin) {
        <div [class.text-exito]="tipoMensaje === 'exito'" [class.text-error]="tipoMensaje === 'error'" class="login-mensaje">
          {{ mensajeLogin }}
        </div>
      }
      
      <button class="btn-aceptar" (click)="validarCredenciales()">Ingresar</button>
    </div>
  </div>
</section>
